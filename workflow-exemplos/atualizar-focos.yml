name: Atualizar focos
on:
  workflow_dispatch:
  schedule:
    - cron: '17,37,57 * * * *'
concurrency:
  group: atualizar-focos
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: dados-processados/cache_recentes
          key: focos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: focos-${{ runner.os }}-
      - name: Atualizar dados operacionais
        id: atualizar
        continue-on-error: true
        run: python scripts/atualizar_focos_recentes.py
      - name: Validar arquivos publicados
        run: python scripts/verificar_publicacao.py
      - name: Registrar dados e diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data dados-processados/auditoria/ultima_atualizacao.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualiza monitoramento recente'
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Sinalizar falha de coleta
        if: steps.atualizar.outcome == 'failure'
        run: exit 1
